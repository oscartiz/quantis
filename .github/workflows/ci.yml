name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The bindings crate is outside default-members (it needs a Python
      # toolchain); keep it compiling even before Phase 2 wires it up.
      - run: cargo check -p quantis-python

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy quantis tests
      - run: uv run pytest -q

  smoke:
    # Phase 0 placeholder: validates the example config end to end. From
    # Phase 1 this becomes a seeded, deterministic backtest on the bundled
    # sample data whose results-artifact hash is asserted, so any change to
    # fill logic or data handling that alters results fails the build.
    name: Smoke (deterministic engine check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p quantis-cli -- config validate config/engine.example.toml
