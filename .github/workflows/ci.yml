name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The bindings crate is outside default-members (it needs a Python
      # toolchain); keep it compiling even before Phase 2 wires it up.
      - run: cargo check -p quantis-python

  python:
    name: Python ${{ matrix.python }} (ruff, mypy, pytest + cross-language)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"] # declared floor + latest stable
    env:
      # Overrides python/.python-version for every uv invocation below, so
      # sync, maturin and pytest all run on the matrix interpreter.
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # Build the Rust extension into the venv so the cross-language tests
      # (Python-driven backtest must reproduce the golden hash) actually run.
      - run: uv run maturin develop --release -m ../crates/python/Cargo.toml
      - run: uv run ruff format --check . ../benchmarks
      - run: uv run ruff check . ../benchmarks
      - run: uv run mypy quantis tests ../benchmarks/book_bench.py
      - run: uv run pytest -q

  smoke:
    # Seeded, deterministic backtest on the committed sample data. The
    # artifact's determinism hash must equal tests/smoke/expected_hash.txt:
    # any change to fill logic, fixed-point math, config, or data handling
    # that alters results fails the build until the golden hash is updated
    # deliberately, in the same commit, with an explanation.
    name: Smoke (golden-hash backtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p quantis-cli -- config validate config/engine.example.toml
      - run: make smoke
