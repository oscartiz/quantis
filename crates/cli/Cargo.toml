[package]
name = "quantis-cli"
description = "Operational command-line interface for the Quantis engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quantis"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
quantis-core.workspace = true
quantis-market-data = { path = "../market-data" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[lints]
workspace = true
