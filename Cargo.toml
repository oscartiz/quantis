[workspace]
resolver = "2"
members = [
    "crates/backtest",
    "crates/cli",
    "crates/core",
    "crates/execution",
    "crates/market-data",
    "crates/python",
    "crates/risk",
]
# `quantis-python` builds against a local Python toolchain, so plain
# `cargo build` / `cargo test` skip it. Build it explicitly with
# `cargo check -p quantis-python` or through maturin (crates/python/pyproject.toml).
default-members = [
    "crates/backtest",
    "crates/cli",
    "crates/core",
    "crates/execution",
    "crates/market-data",
    "crates/risk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
quantis-core = { path = "crates/core" }

# External
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.26", features = ["abi3-py311"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Hot-path profile gets tuned against Criterion numbers in Phase 1; these are
# sane defaults, not measured claims.
[profile.release]
lto = "thin"
codegen-units = 1
